<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMPUS | 우리 학교 커뮤니티</title>
<style>
:root{--blue:#1769e0;--bg:#f4f6fa;--line:#e8ebf1;--muted:#8992a3}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#202636;background:var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:760px;margin:auto;padding:17px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:23px;font-weight:900;color:var(--blue)}
.school{font-size:12px;color:var(--muted);margin-top:3px}
main{max-width:760px;margin:auto;padding:18px 14px 95px}
h2{font-size:19px;margin:8px 0 15px}
.search{width:100%;border:1px solid var(--line);background:white;padding:13px 15px;border-radius:12px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:16px 0}
.cat{flex-shrink:0;border:1px solid var(--line);border-radius:20px;padding:9px 14px;background:white;color:#667085}
.cat.active{background:var(--blue);color:white;border-color:var(--blue)}
.write{width:100%;border:0;padding:16px;border-radius:13px;background:white;text-align:left;color:var(--muted)}
.write strong{color:var(--blue);float:right}
.notice{background:#eaf2ff;padding:15px;border-radius:12px;color:#2855a2;font-size:13px;line-height:1.6;margin:15px 0}
.post{background:white;padding:17px;border-radius:13px;margin-bottom:11px;box-shadow:0 2px 9px #182b4d05}
.meta{color:var(--muted);font-size:12px}
.tag{color:var(--blue);font-weight:700;margin-right:7px}
.post h3{font-size:16px;margin:12px 0 8px}
.content{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:18px;margin-top:15px}
.actions button{border:0;padding:0;background:transparent;color:#7b8495;font-size:13px}
.actions button.liked{color:#e34f75}
.comments{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}
.comments[hidden]{display:none}
.comment{font-size:13px;margin:0;padding:10px 0;line-height:1.6;border-bottom:1px solid #f1f2f5;overflow-wrap:anywhere}
.comment-name{font-weight:700;color:#667085;margin-right:6px}
.comment-form{display:flex;gap:7px;margin-top:12px}
.comment-form input{min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:8px}
.comment-form button,.primary{border:0;border-radius:8px;padding:10px 13px;color:white;background:var(--blue)}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.nav-inner{display:flex;width:100%;max-width:760px}
.nav-btn{flex:1;border:0;background:white;padding:13px 3px calc(13px + env(safe-area-inset-bottom));color:var(--muted);font-size:12px}
.nav-btn span{display:block;font-size:20px;margin-bottom:4px}
.nav-btn.active{color:var(--blue);font-weight:700}
.modal{display:none;position:fixed;inset:0;z-index:10;background:#10182888;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:600px;background:white;border-radius:20px 20px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.sheet input,.sheet textarea,.sheet select{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;margin:10px 0;background:white}
.sheet textarea{min-height:130px;resize:vertical}
.sheet .primary{width:100%;padding:14px}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
@media(min-width:600px){main{padding-top:25px}.modal{align-items:center}.sheet{border-radius:18px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="logo">CAMPUS.</div><div class="school">우리 학교 학생 커뮤니티</div></div><span>🎓</span></div></header>

<main>
<h2>학교생활, 여기서 이야기해요 👋</h2>
<input id="search" class="search" placeholder="🔍 게시글 검색하기">
<div class="categories" id="categories"></div>
<button class="write" id="openWrite">무슨 이야기를 나누고 싶나요? <strong>＋ 글쓰기</strong></button>
<div class="notice">💙 <b>CAMPUS 이용 안내</b><br>서로를 존중하는 커뮤니티를 만들어 주세요. 개인정보나 민감한 정보는 게시하지 마세요.</div>
<h2 id="listTitle">🔥 실시간 게시판</h2>
<section id="posts"></section>
</main>

<nav><div class="nav-inner">
<button class="nav-btn active" data-page="전체"><span>⌂</span>홈</button>
<button class="nav-btn" data-page="자유게시판"><span>▤</span>게시판</button>
<button class="nav-btn" data-page="인기글"><span>♡</span>인기글</button>
<button class="nav-btn" id="myPosts"><span>♙</span>내 글</button>
</div></nav>

<div class="modal" id="modal">
<form class="sheet" id="postForm">
<h2>✏️ 새 게시글</h2>
<label for="category">게시판 선택</label>
<select id="category"><option>자유게시판</option><option>비밀게시판</option><option>질문게시판</option><option>정보게시판</option><option>학교생활</option></select>
<input id="title" maxlength="100" placeholder="제목을 입력해 주세요" required>
<textarea id="body" maxlength="3000" placeholder="여기에 내용을 작성해 주세요" required></textarea>
<p class="small">익명으로 표시됩니다. 현재 데모는 실제 학교 인증이나 서버 계정을 제공하지 않습니다.</p>
<button class="primary" type="submit">게시글 올리기</button>
<button type="button" id="closeModal" style="width:100%;padding:13px;border:0;background:white">취소</button>
</form>
</div>

<script>
const categories=["전체","자유게시판","비밀게시판","질문게시판","정보게시판","학교생활"];
const samples=[
{id:1,category:"자유게시판",title:"다들 오늘 수업 어땠어?",body:"오늘 수업 내용이 생각보다 어렵더라 🥹\n다들 복습 어떻게 하고 있어?",likes:12,comments:[{id:1,text:"나도 어려웠어 ㅠㅠ"},{id:2,text:"같이 복습하자!"}]},
{id:2,category:"질문게시판",title:"학교 근처 맛집 추천해 줘!",body:"친구랑 밥 먹으려고 하는데 가성비 좋은 곳 있을까?",likes:7,comments:[]},
{id:3,category:"정보게시판",title:"중간고사 공부 같이 할 사람",body:"도서관에서 같이 공부하면 좋을 것 같아서 글 올려 봐!",likes:4,comments:[]}
];
const $=id=>document.getElementById(id);
const storageKey="campus_demo_posts_v2";
const likedKey="campus_demo_likes_v2";
let posts;
try{const saved=JSON.parse(localStorage.getItem(storageKey));posts=Array.isArray(saved)?saved:samples}
catch{posts=samples}
posts.forEach(p=>{if(!Array.isArray(p.comments))p.comments=[]});
let liked=new Set();
try{const saved=JSON.parse(localStorage.getItem(likedKey));if(Array.isArray(saved))liked=new Set(saved)}catch{}
let page="전체",myOnly=false;
let nextId=Math.max(0,...posts.map(p=>Number(p.id)||0))+1;
let nextCommentId=1;
posts.forEach(p=>p.comments.forEach(c=>{nextCommentId=Math.max(nextCommentId,(Number(c.id)||0)+1)}));
const expandedComments=new Set();

function save(){
 try{localStorage.setItem(storageKey,JSON.stringify(posts));localStorage.setItem(likedKey,JSON.stringify([...liked]))}
 catch{alert("브라우저 저장 공간이 부족해요.")}
}
function el(tag,cls,text){
 const n=document.createElement(tag);
 if(cls)n.className=cls;
 if(text!==undefined)n.textContent=text;
 return n;
}
function renderCategories(){
 $("categories").replaceChildren();
 categories.forEach(name=>{
  const b=el("button","cat"+(page===name?" active":""),name);
  b.onclick=()=>{page=name;myOnly=false;render()};
  $("categories").append(b);
 });
}
function render(){
 renderCategories();
 $("listTitle").textContent=myOnly?"📝 내가 작성한 글":page==="인기글"?"❤️ 인기 게시글":page==="전체"?"🔥 실시간 게시판":"📋 "+page;
 document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.classList.toggle("active",!myOnly&&b.dataset.page===page));
 $("myPosts").classList.toggle("active",myOnly);
 const q=$("search").value.trim().toLowerCase();
 let list=posts.filter(p=>{
  const categoryMatch=page==="전체"||page==="인기글"||page==="자유게시판"||p.category===page;
  return categoryMatch&&(p.title+" "+p.body).toLowerCase().includes(q)&&(!myOnly||p.mine===true);
 });
 if(page==="인기글")list=list.filter(p=>p.likes>=5);
 list.sort((a,b)=>b.id-a.id);
 $("posts").replaceChildren();
 if(!list.length){$("posts").append(el("div","empty","게시글이 없어요. 첫 글을 작성해 보세요!"));return}
 list.forEach(p=>{
  const card=el("article","post");
  const meta=el("div","meta");
  meta.append(el("span","tag",p.category),document.createTextNode("익명 · "+(p.date||"방금 전")));
  card.append(meta,el("h3","",p.title),el("div","content",p.body));
  const actions=el("div","actions");
  const like=el("button",liked.has(p.id)?"liked":"","♡ 좋아요 "+p.likes);
  if(liked.has(p.id))like.textContent="♥ 좋아요 "+p.likes;
  like.onclick=()=>{
   if(liked.has(p.id)){liked.delete(p.id);p.likes=Math.max(0,p.likes-1)}
   else{liked.add(p.id);p.likes++}
   save();render();
  };
  const toggle=el("button","","💬 댓글 "+p.comments.length);
  toggle.onclick=()=>{if(expandedComments.has(p.id))expandedComments.delete(p.id);else expandedComments.add(p.id);render()};
  actions.append(like,toggle);card.append(actions);
  const commentBox=el("div","comments");
  commentBox.hidden=!expandedComments.has(p.id);
  p.comments.forEach(c=>{
   const line=el("div","comment");
   line.append(el("span","comment-name","익명"),document.createTextNode(c.text));
   commentBox.append(line);
  });
  const form=el("form","comment-form");
  const input=el("input");
  input.placeholder="익명으로 댓글 남기기...";
  input.maxLength=500;input.required=true;
  input.setAttribute("aria-label","익명 댓글");
  const submit=el("button","","등록");
  submit.type="submit";
  form.append(input,submit);
  form.onsubmit=e=>{
   e.preventDefault();
   const text=input.value.trim();
   if(!text)return;
   p.comments.push({id:nextCommentId++,text});
   expandedComments.add(p.id);
   save();render();
  };
  commentBox.append(form);
  card.append(commentBox);
  $("posts").append(card);
 });
}
$("openWrite").onclick=()=>$("modal").classList.add("show");
$("closeModal").onclick=()=>$("modal").classList.remove("show");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("show")};
$("postForm").onsubmit=e=>{
 e.preventDefault();
 const title=$("title").value.trim(),body=$("body").value.trim();
 if(!title||!body)return;
 posts.push({id:nextId++,category:$("category").value,title,body,likes:0,comments:[],mine:true,date:new Date().toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})});
 save();$("postForm").reset();$("modal").classList.remove("show");
 page="전체";myOnly=false;render();window.scrollTo({top:0,behavior:"smooth"});
};
$("search").addEventListener("input",render);
document.querySelectorAll(".nav-btn[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;myOnly=false;render()});
$("myPosts").onclick=()=>{myOnly=true;render()};
render();
</script>
</body>
</html>
